substitutions:
  name: "econet-tlwh-atomic-s3"
  friendly_name: "Tankless Water Heater"
  device_description: "Rheem Tankless Water Heater (Atom S3 Lite)"

  tx_pin: GPIO6
  rx_pin: GPIO5
  static_ip: "192.168.5.178"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  min_version: "2025.11.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: /config/esphome/external_components/esphome-econet/components
    components: [econet]

uart:
  id: econet_uart
  baud_rate: 38400
  rx_buffer_size: 1500
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}

packages:
  econet-tlwh: !include econet_tankless_water_heater.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  manual_ip:
    static_ip: 192.168.1.178
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

logger:
  level: INFO
#  level: VERBOSE
  tx_buffer_size: 1024

ota:
  platform: esphome
  password: !secret ota_password

api:
  port: 6053
  batch_delay: 50ms
  listen_backlog: 4
  max_connections: 8
  max_send_queue: 10
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

sensor:
  # 2026-07-29: WH-TNK2 does not implement WTR_BTUS / FLOWRATE. Upstream polls
  # them anyway -> UNSUPPORTED warnings every ~5s and nan sensors. instant_btus'
  # lambda references id(flow_rate) so it must go too; total_gas_usage is fed by
  # btus' on_value and would never update.
  - id: !remove btus
  - id: !remove flow_rate
  - id: !remove instant_btus
  - id: !remove total_gas_usage
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 30s

  - platform: wifi_signal
    name: "${friendly_name} WiFi RSSI"
    update_interval: 30s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"
    bssid:
      name: "${friendly_name} BSSID"
    mac_address:
      name: "${friendly_name} MAC"

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"